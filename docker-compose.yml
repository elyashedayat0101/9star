services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "3"
      - --threads
      - "2"
      - --timeout
      - "60"
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    restart: unless-stopped


volumes:
  static_volume:
  media_volume: